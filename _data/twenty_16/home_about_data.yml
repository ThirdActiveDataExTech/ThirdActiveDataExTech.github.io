- inverted: 
  img:  data.png
  name: 써드파티 데이터 수집
  info: 인터넷 전역에 흩어진 공공·민간 데이터를 자동으로 탐색하고 수집하여, 목적에 맞게 구조화합니다. 
  웹 크롤링, 오픈 API, RSS 등 다양한 채널을 통해 데이터를 확보하고, 중복 제거 및 정제 과정을 거쳐 신뢰도 높은 데이터셋으로 제공합니다.
#  link: "project/intro"

- inverted: timeline-inverted
  img: analysis.png
  name: 데이터 간 관계 생성
  info: 수집된 데이터 간의 의미적 연결을 분석하여 관계망을 형성합니다. 
  메타데이터 기반으로 데이터 간 유사도, 연관도, 흐름을 도출하며, 이를 통해 능동적으로 확장되는 데이터 네트워크를 구현합니다.
#  link: "project/intro"

- inverted:
  img: parts.png
  name: 방대한 적용
  info: 공공 데이터, 의료, 산업, 금융, 교육 등 다양한 영역에서 써드파티 데이터를 활용할 수 있습니다. 
  데이터 탐색, 추천, 시각화, 인사이트 도출 등 맞춤형 응용 서비스로 확장 가능하여, 산업 전반의 데이터 활용 가치를 높입니다.
